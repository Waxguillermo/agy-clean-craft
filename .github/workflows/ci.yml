name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Run linter and formatter check
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Run unit tests
        run: uv run pytest
      - name: Self-audit repository with agy-sync audit
        run: uv run agy-sync audit
